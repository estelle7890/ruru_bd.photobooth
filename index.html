<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Ruka Photobooth 🎂</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #ff5fa2, #ffc1dc);
}

.container {
  margin-top: 80px;
}

.circle {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 10px solid #1e2a8a;
  overflow: hidden;
  margin: auto;
}

.circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h1 {
  margin-top: 30px;
}

button {
  padding: 15px 25px;
  border: none;
  border-radius: 999px;
  background: #ff2e7a;
  color: white;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

  <div class="circle">
    <img src="ruka.jpg">
  </div>

  <h1>WELCOME TO</h1>
  <h2>RUKA PHOTOBOOTH</h2>

  <button onclick="go()">ENTER 💖</button>

</div>

<script>
function go(){
  window.location.href = "booth.html";
}
</script>

</body>
</html>
